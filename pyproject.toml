[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schemasurgeon"
version = "0.1.0"
description = "SchemaSurgeon: Evidence-Driven Self-Healing Tool Registry for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "jsonschema>=4.18.0",
    "jsonpatch>=1.33",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
